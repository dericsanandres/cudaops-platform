name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: test -x scripts/benchmark.sh
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...

  processor-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - run: cmake -S processor -B build/processor -G Ninja -DCUDAOPS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON
      - run: cmake --build build/processor
      - run: ctest --test-dir build/processor --output-on-failure
      - name: Verify CPU CLI and fallback semantics
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > tiny.png
          build/processor/cudaops-process --input tiny.png --output cpu.png --device cpu | grep '"device":"cpu","fallback_used":false'
          build/processor/cudaops-process --input tiny.png --output auto.png --device auto | grep '"device":"cpu","fallback_used":true'
          cmp cpu.png auto.png
          if build/processor/cudaops-process --input tiny.png --output cuda.png --device cuda; then exit 1; fi
          printf '\x89PNG\r\n\x1a\n' > corrupt.png
          if build/processor/cudaops-process --input corrupt.png --output bad.png --device cpu; then exit 1; fi
          if build/processor/cudaops-process --input corrupt.png --output bad.png --device invalid; then exit 1; fi

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.cpu.yaml config --quiet
      - run: docker build --target worker -t cudaops-worker:test .
      - name: CPU fallback smoke test
        run: |
          set -euo pipefail
          trap 'docker compose -f compose.yaml -f compose.cpu.yaml logs; docker compose -f compose.yaml -f compose.cpu.yaml down -v' EXIT
          docker compose -f compose.yaml -f compose.cpu.yaml up -d --build redis api worker
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > tiny.png
          for i in {1..30}; do curl -fsS http://localhost:8080/readyz && break; sleep 1; done
          response=$(curl -fsS -F image=@tiny.png -F device=auto http://localhost:8080/v1/jobs)
          id=$(printf '%s' "$response" | jq -r .id)
          for i in {1..30}; do
            status=$(curl -fsS "http://localhost:8080/v1/jobs/$id")
            state=$(printf '%s' "$status" | jq -r .status)
            [ "$state" = succeeded ] && break
            [ "$state" = failed ] && { printf '%s\n' "$status"; exit 1; }
            sleep 1
          done
          printf '%s' "$status" | jq -e '.status == "succeeded" and .used_device == "cpu" and .fallback_used == true'
          curl -fsS "http://localhost:8080/v1/jobs/$id/result" -o result.png
          test "$(head -c 8 result.png | base64)" = "iVBORw0KGgo="
